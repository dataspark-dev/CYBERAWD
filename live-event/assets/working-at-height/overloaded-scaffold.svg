<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- scaffold frame -->
  <g stroke="#94a3b8" stroke-width="6" fill="none">
    <line x1="520" y1="420" x2="520" y2="760"/>
    <line x1="1080" y1="420" x2="1080" y2="760"/>
    <line x1="520" y1="600" x2="1080" y2="600"/>
    <line x1="520" y1="700" x2="1080" y2="700"/>
  </g>
  <rect x="500" y="400" width="600" height="24" fill="#475569"/>

  <!-- overloaded materials stacked on the platform -->
  <g fill="#b45309">
    <rect x="560" y="330" width="120" height="70" rx="4"/>
    <rect x="690" y="320" width="120" height="80" rx="4"/>
    <rect x="820" y="335" width="120" height="65" rx="4"/>
    <rect x="600" y="270" width="90" height="60" rx="4"/>
    <rect x="760" y="260" width="90" height="60" rx="4"/>
  </g>
  <!-- steel drums stacked too -->
  <circle cx="960" cy="360" r="30" fill="#64748b"/>
  <circle cx="1000" cy="360" r="30" fill="#64748b"/>

  <!-- two workers on an overcrowded deck -->
  <g transform="translate(650,350)">
    <circle cx="0" cy="0" r="26" fill="#facc15"/>
    <rect x="-22" y="26" width="44" height="80" rx="12" fill="#0ea5e9"/>
  </g>
  <g transform="translate(880,370)">
    <circle cx="0" cy="0" r="26" fill="#facc15"/>
    <rect x="-22" y="26" width="44" height="80" rx="12" fill="#0ea5e9"/>
  </g>

  <path d="M 900 420 L 1080 420" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,8"/>
  <text x="1250" y="415" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">no load</text>
  <text x="1250" y="440" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">rating sign</text>

  <g transform="translate(340,700)">
    <rect x="0" y="0" width="920" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="30" font-family="Orbitron, sans-serif" font-size="18" font-weight="700" fill="#991b1b">SPOT THE HAZARD:</text>
    <text x="20" y="62" font-family="Barlow, sans-serif" font-size="18" fill="#7f1d1d">Materials, drums and two workers crowd a scaffold deck well past its posted safe working load</text>
  </g>

  <text x="800" y="850" font-family="Space Mono, monospace" font-size="18" fill="#67e8f9" text-anchor="middle" letter-spacing="2">WORKING AT HEIGHT · ITEM 4 OF 8 · OVERLOADED SCAFFOLD</text>
</svg>
