<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- deck -->
  <rect x="380" y="500" width="900" height="30" fill="#334155"/>
  <!-- open hatch, no cover, no barrier -->
  <ellipse cx="850" cy="515" rx="130" ry="40" fill="#020617" stroke="#dc2626" stroke-width="4" stroke-dasharray="8,6"/>
  <text x="850" y="520" font-family="Space Mono, monospace" font-size="16" fill="#dc2626" text-anchor="middle">OPEN HATCH</text>

  <!-- worker walking toward it, distracted, looking at phone -->
  <g transform="translate(650,470)">
    <circle cx="0" cy="0" r="30" fill="#facc15"/>
    <rect x="-26" y="30" width="52" height="96" rx="14" fill="#f97316"/>
    <rect x="14" y="60" width="18" height="26" fill="#0f172a"/>
  </g>
  <path d="M 700 470 L 780 480" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,8"/>
  <text x="780" y="440" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">walking, distracted</text>

  <text x="1200" y="470" font-family="Barlow, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">No cover, no</text>
  <text x="1200" y="496" font-family="Barlow, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">barrier, no signage</text>

  <g transform="translate(340,700)">
    <rect x="0" y="0" width="920" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="30" font-family="Orbitron, sans-serif" font-size="18" font-weight="700" fill="#991b1b">SPOT THE HAZARD:</text>
    <text x="20" y="62" font-family="Barlow, sans-serif" font-size="18" fill="#7f1d1d">An uncovered deck opening has no barrier or warning sign, and a distracted worker is walking straight toward it</text>
  </g>

  <text x="800" y="850" font-family="Space Mono, monospace" font-size="18" fill="#67e8f9" text-anchor="middle" letter-spacing="2">WORKING AT HEIGHT · ITEM 5 OF 8 · UNPROTECTED OPENING</text>
</svg>
