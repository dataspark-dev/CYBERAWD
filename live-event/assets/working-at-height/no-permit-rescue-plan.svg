<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- crew starting work at an elevated platform, empty permit board -->
  <rect x="500" y="220" width="280" height="200" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>
  <text x="640" y="255" font-family="Orbitron, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">PERMIT BOARD</text>
  <rect x="530" y="280" width="220" height="30" rx="4" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,6"/>
  <text x="640" y="300" font-family="Space Mono, monospace" font-size="14" fill="#dc2626" text-anchor="middle">— NO PERMIT ISSUED —</text>
  <rect x="530" y="330" width="220" height="30" rx="4" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,6"/>
  <text x="640" y="350" font-family="Space Mono, monospace" font-size="14" fill="#dc2626" text-anchor="middle">— NO RESCUE PLAN —</text>

  <!-- workers already climbing the structure -->
  <g stroke="#94a3b8" stroke-width="6" fill="none">
    <line x1="950" y1="200" x2="950" y2="760"/>
    <line x1="1150" y1="200" x2="1150" y2="760"/>
    <line x1="950" y1="400" x2="1150" y2="400"/>
    <line x1="950" y1="560" x2="1150" y2="560"/>
  </g>
  <g transform="translate(1050,320)">
    <circle cx="0" cy="0" r="28" fill="#facc15"/>
    <rect x="-24" y="28" width="48" height="90" rx="12" fill="#7c3aed"/>
  </g>

  <path d="M 900 300 L 1000 320" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,8"/>
  <text x="900" y="470" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">work already underway,</text>
  <text x="900" y="496" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">board still blank</text>

  <g transform="translate(340,700)">
    <rect x="0" y="0" width="920" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="30" font-family="Orbitron, sans-serif" font-size="18" font-weight="700" fill="#991b1b">SPOT THE HAZARD:</text>
    <text x="20" y="62" font-family="Barlow, sans-serif" font-size="18" fill="#7f1d1d">The crew is already working at height, but no permit was signed off and there's no rescue plan in place if someone falls</text>
  </g>

  <text x="800" y="850" font-family="Space Mono, monospace" font-size="18" fill="#67e8f9" text-anchor="middle" letter-spacing="2">WORKING AT HEIGHT · ITEM 7 OF 8 · NO PERMIT OR RESCUE PLAN</text>
</svg>
