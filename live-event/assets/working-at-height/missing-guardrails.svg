<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- elevated platform -->
  <rect x="480" y="420" width="700" height="26" fill="#475569"/>
  <line x1="500" y1="446" x2="500" y2="760" stroke="#94a3b8" stroke-width="10"/>
  <line x1="1140" y1="446" x2="1140" y2="760" stroke="#94a3b8" stroke-width="10"/>

  <!-- guardrail present on left side only -->
  <g stroke="#22c55e" stroke-width="8">
    <line x1="500" y1="330" x2="820" y2="330"/>
    <line x1="500" y1="330" x2="500" y2="420"/>
    <line x1="820" y1="330" x2="820" y2="420"/>
    <line x1="500" y1="380" x2="820" y2="380"/>
  </g>
  <!-- right side of platform: open edge, no rail -->
  <text x="1000" y="400" font-family="Barlow, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">open edge —</text>
  <text x="1000" y="420" font-family="Barlow, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">no guardrail</text>

  <!-- worker near the open edge -->
  <g transform="translate(1000,340)">
    <circle cx="0" cy="0" r="30" fill="#facc15"/>
    <rect x="-26" y="30" width="52" height="96" rx="14" fill="#7c3aed"/>
  </g>

  <path d="M 1010 400 L 1010 440" stroke="#dc2626" stroke-width="4" stroke-dasharray="10,8"/>
  <text x="1010" y="470" font-family="Barlow, sans-serif" font-size="18" fill="#dc2626" text-anchor="middle">drop below</text>

  <g transform="translate(340,700)">
    <rect x="0" y="0" width="920" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="30" font-family="Orbitron, sans-serif" font-size="18" font-weight="700" fill="#991b1b">SPOT THE HAZARD:</text>
    <text x="20" y="62" font-family="Barlow, sans-serif" font-size="18" fill="#7f1d1d">Guardrails cover one side of the platform, but a worker stands right at the unprotected open edge</text>
  </g>

  <text x="800" y="850" font-family="Space Mono, monospace" font-size="18" fill="#67e8f9" text-anchor="middle" letter-spacing="2">WORKING AT HEIGHT · ITEM 3 OF 8 · MISSING GUARDRAILS</text>
</svg>
