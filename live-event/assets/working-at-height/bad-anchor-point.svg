<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>

  <!-- pipework running along a wall, worker tied off to a thin pipe -->
  <rect x="500" y="250" width="620" height="40" rx="10" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <rect x="500" y="250" width="620" height="40" rx="10" fill="none" stroke="#334155" stroke-width="2"/>

  <g transform="translate(760,420)">
    <circle cx="0" cy="0" r="32" fill="#facc15"/>
    <rect x="-28" y="32" width="56" height="102" rx="14" fill="#0ea5e9"/>
  </g>

  <path d="M 760 270 C 730 330, 720 380, 760 420" stroke="#facc15" stroke-width="6" fill="none"/>
  <circle cx="760" cy="270" r="8" fill="#e11d48"/>

  <text x="1050" y="270" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">lanyard clipped to</text>
  <text x="1050" y="296" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">a process pipe —</text>
  <text x="1050" y="322" font-family="Barlow, sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">not a rated anchor</text>
  <path d="M 900 300 L 800 275" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10,8"/>

  <text x="500" y="600" font-family="Barlow, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Rated anchor point</text>
  <text x="500" y="622" font-family="Barlow, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">(unused, 40m away) →</text>
  <g transform="translate(300,560)" stroke="#22c55e" stroke-width="6" fill="none">
    <circle cx="0" cy="0" r="24"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
  </g>

  <g transform="translate(340,700)">
    <rect x="0" y="0" width="920" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="30" font-family="Orbitron, sans-serif" font-size="18" font-weight="700" fill="#991b1b">SPOT THE HAZARD:</text>
    <text x="20" y="62" font-family="Barlow, sans-serif" font-size="18" fill="#7f1d1d">The lanyard is clipped to a process pipe instead of the rated anchor point nearby — the pipe was never designed to arrest a fall</text>
  </g>

  <text x="800" y="850" font-family="Space Mono, monospace" font-size="18" fill="#67e8f9" text-anchor="middle" letter-spacing="2">WORKING AT HEIGHT · ITEM 6 OF 8 · IMPROVISED ANCHOR POINT</text>
</svg>
