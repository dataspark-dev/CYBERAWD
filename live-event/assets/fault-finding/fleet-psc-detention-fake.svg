  <text x="250" y="364" font-family="Barlow, sans-serif" font-size="18" fill="#374151">further port charges.</text>
  <text x="250" y="700" font-family="Barlow, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Port Authority Notice</text>
