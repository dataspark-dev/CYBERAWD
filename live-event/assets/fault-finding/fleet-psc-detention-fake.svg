  <text x="250" y="164" font-family="Space Mono, monospace" font-size="16" fill="#111827">From: Port Authority Notice &lt;notice@port-stateauthority.net&gt;</text>
  <text x="250" y="235" font-family="Barlow, sans-serif" font-size="18" fill="#374151">Subject: URGENT — Deficiency Fee Payment Required to Avoid Detention</text>
  <text x="250" y="300" font-family="Barlow, sans-serif" font-size="18" fill="#374151">MV Horizon has an unpaid deficiency fee on record. Pay</text>
