<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0f172a"/>
  <rect x="220" y="120" width="1160" height="660" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="220" y="120" width="1160" height="70" rx="12" fill="#f1f5f9"/>
  <text x="250" y="164" font-family="Space Mono, monospace" font-size="16" fill="#111827">From: PyPI Security &lt;noreply@pypi-security.org&gt;</text>
  <text x="250" y="235" font-family="Barlow, sans-serif" font-size="18" fill="#374151">Subject: URGENT — Verify Your Maintainer Account or Lose Publish Access</text>
  <text x="250" y="300" font-family="Barlow, sans-serif" font-size="18" fill="#374151">Unusual activity was detected on your maintainer account.</text>
  <text x="250" y="332" font-family="Barlow, sans-serif" font-size="18" fill="#374151">Verify your identity below within 24 hours or you will lose</text>
  <text x="250" y="364" font-family="Barlow, sans-serif" font-size="18" fill="#374151">publish access to fleet-utils and all your other packages.</text>
  <g transform="translate(250,406)">
    <rect x="0" y="0" width="320" height="44" rx="6" fill="#dc2626"/>
    <text x="160" y="29" font-family="Barlow, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">VERIFY MAINTAINER ACCOUNT</text>
  </g>
  <text x="250" y="700" font-family="Barlow, sans-serif" font-size="18" font-weight="700" fill="#1e293b">PyPI Security Team</text>
  <text x="800" y="845" font-family="Space Mono, monospace" font-size="16" fill="#67e8f9" text-anchor="middle" letter-spacing="2">PYPI SECURITY — ACCOUNT VERIFICATION REQUIRED</text>
</svg>
