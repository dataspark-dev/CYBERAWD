<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Decision Room — Live Event Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../console.css" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg"/>
</head>
<body data-home="../index.html">
  <div class="le-shell">
    <div class="le-grid-bg"></div>

    <header class="le-topbar">
      <a class="le-home-link" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
      <div class="le-module-tag"><i class="fa-solid fa-diagram-project"></i> Decision Room</div>
      <div class="le-topbar-right" id="phaseLabel"></div>
    </header>

    <main class="le-main">
      <div class="le-item-counter" id="itemCounter">Case 1 of 6</div>
      <p class="dr-intro">Take your time — talk it through as a room. Every choice here has a reason, not a countdown.</p>
      <div class="ff-title-bar">
        <div class="dr-persona-tag" id="casePersona"></div>
        <h2 id="caseTitle">—</h2>
        <div class="dr-scenario-context" id="caseScenario"></div>
        <div class="dr-path" id="casePath"></div>
      </div>

      <div class="cq-stage">
        <div class="dr-decision" id="decisionStage">
          <!-- Rendered by decision-room.js: current decision's prompt + option cards, or the case debrief -->
        </div>

        <div class="le-timer dr-calm-timer" id="timer">
          <div class="lt-digits">90</div>
          <div class="lt-label">Seconds</div>
        </div>

        <div class="le-btn-row" id="btnRow">
          <button class="le-btn primary lg" id="nextBtn" type="button" disabled><i class="fa-solid fa-forward"></i> Next Decision</button>
        </div>

        <div class="le-progress-dots dr-dots" id="progressDots"></div>
      </div>
    </main>

    <div class="le-keyhints">
      <div class="le-keyhint">Click an option to choose (or press <kbd>1</kbd>-<kbd>3</kbd>)</div>
      <div class="le-keyhint"><kbd>SPACE</kbd> next</div>
      <div class="le-keyhint"><kbd>←</kbd> back</div>
      <div class="le-keyhint"><kbd>ESC</kbd> home</div>
      <div class="le-keyhint"><kbd>F</kbd> fullscreen</div>
    </div>

  </div>

  <script src="../console.js"></script>
  <script src="decision-room.js"></script>
</body>
</html>
